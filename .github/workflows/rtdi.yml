name: RT.DI

# Hands-off pipeline: discover new DragRaceCentral eliminations summaries, parse,
# run the sanity gate, and publish to GitHub Pages (gh-pages) when the data
# changes. Raw data and state are committed back so nothing is ever lost and the
# run-count gate has a baseline.
#
# Schedule covers Sunday night through Tuesday (US Central), when DRC posts the
# weekend's summaries. Times are UTC; CDT is UTC-5, so "Sunday night Central" is
# early Monday UTC. Commits happen only when data changes, so extra runs are free.
on:
  schedule:
    - cron: "0 23 * * 0"          # Sun 23:00 UTC (late Sun afternoon Central, race wrapping up)
    - cron: "0 */2 * * 1,2"       # Mon & Tue, every 2h UTC (Sun night -> Tue day Central)
    - cron: "0 1,3,5 * * 3"       # early Wed UTC (Tue night Central tail)
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish to gh-pages even if the data did not change"
        type: boolean
        default: false
  push:
    branches: [claude/cool-davinci-vxlzac]   # lets the pipeline be tested on the dev branch
    paths:
      - run.py
      - drc_discover.py
      - universal_parser.py
      - build_artifact.py
      - race_resolver.py
      - pdra_data.py
      - rt_di_artifact.html
      - CNAME

permissions:
  contents: write
  issues: write

concurrency:
  group: rtdi-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover, build, gate, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          FOOTER=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          git config user.name "RT.DI Bot"
          git config user.email "rt-di@dragillustrated.com"

          OUT="$(python3 run.py 2>&1)"; echo "$OUT"
          STATUS="$(printf '%s\n' "$OUT" | grep -oE '^(CHANGED|UNCHANGED|BLOCKED)' | head -1 || true)"

          # ---- BLOCKED: open/append a single sanity-gate issue, publish nothing ----
          if [ "$STATUS" = "BLOCKED" ]; then
            REASONS="$(printf '%s\n' "$OUT" | grep -E '^BLOCKED' | sed 's/^BLOCKED //' || true)"
            gh label create sanity-gate --color B60205 --description "RT.DI publish blocked" 2>/dev/null || true
            NUM="$(gh issue list --label sanity-gate --state open --json number -q '.[0].number' 2>/dev/null || true)"
            BODY="RT.DI sanity gate blocked a publish on $(date -u '+%Y-%m-%d %H:%M UTC'). No data was published; the live site still shows the last good build."$'\n\n```json\n'"$REASONS"$'\n```'"$FOOTER"
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "$BODY"
            else
              gh issue create --label sanity-gate --title "RT.DI sanity gate: publish blocked" --body "$BODY"
            fi
            echo "::warning::RT.DI sanity gate blocked publish: $REASONS"
            exit 0
          fi

          # ---- success: close any open sanity-gate issue ----
          if [ "$STATUS" = "CHANGED" ] || [ "$STATUS" = "UNCHANGED" ]; then
            NUM="$(gh issue list --label sanity-gate --state open --json number -q '.[0].number' 2>/dev/null || true)"
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "A later run succeeded ($STATUS); closing.$FOOTER" || true
              gh issue close "$NUM" || true
            fi
          fi

          # ---- commit raw data + state + outputs back ----
          # Always persist (even on UNCHANGED) so the scan frontier and any newly
          # saved story files are kept; keeps off-season scans from restarting.
          git add -A
          if ! git diff --cached --quiet; then
            MSG="RT.DI: $(printf '%s' "$OUT" | grep -m1 -E '^(CHANGED|UNCHANGED)' | cut -c1-120)"
            git commit -m "${MSG:-RT.DI update}" || true
            git push origin "HEAD:$TARGET_BRANCH" || { git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH"; }
          fi

          # ---- decide whether to publish to gh-pages ----
          HAS_PAGES=0
          git fetch origin gh-pages 2>/dev/null && git rev-parse --verify origin/gh-pages >/dev/null 2>&1 && HAS_PAGES=1
          PUBLISH=0
          [ "$STATUS" = "CHANGED" ] && PUBLISH=1
          [ "$HAS_PAGES" = "0" ] && PUBLISH=1
          [ "${FORCE_PUBLISH:-false}" = "true" ] && PUBLISH=1
          if [ "$PUBLISH" = "0" ]; then echo "nothing to publish ($STATUS)"; exit 0; fi

          # ---- publish the self-contained artifact as the site ----
          if [ "$HAS_PAGES" = "1" ]; then
            git worktree add site origin/gh-pages
            (cd site && git checkout -B gh-pages origin/gh-pages)
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rf . -q 2>/dev/null || true)
          fi
          cp -f rt_di_artifact.html site/index.html
          cp -f CNAME site/CNAME
          touch site/.nojekyll
          (cd site && git add -A && git commit -m "Publish $(date -u '+%Y-%m-%d %H:%M UTC')" \
            && (git push origin gh-pages \
                || (git fetch origin gh-pages && git rebase -X theirs origin/gh-pages && git push origin gh-pages))) \
            || echo "nothing new to publish on gh-pages"
          echo "published to gh-pages"
